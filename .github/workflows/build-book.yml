name: Build book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: book
          latexmk_use_lualatex: false
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: notes-on-machine-learning
          path: book/main.pdf
